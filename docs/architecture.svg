<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="physGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bg)" rx="16" />

  <!-- Title -->
  <text x="480" y="45" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">PISTGAT Architecture: Spatiotemporal Graph Transformer</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">Physics-Informed Graph Attention Network with Capacity Monotonicity Priors</text>

  <!-- Section 1: Unified Data Ingestion -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="200" height="310" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="100" y="32" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Unified Data Ingestion</text>
    
    <rect x="20" y="55" width="160" height="42" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="100" y="81" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">NASA Ames (B0005..)</text>

    <rect x="20" y="110" width="160" height="42" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="100" y="136" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">CALCE (CS2_35..)</text>

    <rect x="20" y="165" width="160" height="42" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="100" y="191" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Oxford Battery Group</text>

    <rect x="20" y="225" width="160" height="60" rx="8" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" />
    <text x="100" y="248" fill="#7dd3fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Standard Windowing</text>
    <text x="100" y="268" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">(V, I, T, R0, Δt)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 265 L 290 265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Section 2: PISTGAT Backbone -->
  <g transform="translate(300, 110)" filter="url(#shadow)">
    <rect width="360" height="310" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="180" y="32" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Spatiotemporal Deep Learning</text>

    <!-- Temporal Transformer -->
    <rect x="25" y="55" width="310" height="65" rx="8" fill="url(#transGrad)" />
    <text x="180" y="82" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Temporal Transformer Encoder</text>
    <text x="180" y="103" fill="#e0f2fe" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Multi-Head Self-Attention over Cycle Horizons</text>

    <!-- Spatial GAT -->
    <rect x="25" y="135" width="310" height="65" rx="8" fill="url(#gatGrad)" />
    <text x="180" y="162" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Spatial Graph Attention (GATv2)</text>
    <text x="180" y="183" fill="#ecfdf5" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">4S to 12S Inter-Cell Thermal/Electrical Couplings</text>

    <!-- Physics Guidance -->
    <rect x="25" y="215" width="310" height="75" rx="8" fill="url(#physGrad)" />
    <text x="180" y="242" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Physics-Guided Inductive Priors</text>
    <text x="180" y="262" fill="#fef3c7" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Internal Resistance Fusion + Capacity Monotonicity Loss</text>
    <text x="180" y="278" fill="#fde68a" font-size="10" text-anchor="middle" font-family="monospace">L_total = L_MSE + λ * ReLU(Δy - ε)^2</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 665 265 L 710 265" stroke="#64748b" stroke-width="2" />

  <!-- Section 3: Evaluation & 3D Twin Output -->
  <g transform="translate(720, 110)" filter="url(#shadow)">
    <rect width="200" height="310" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="100" y="32" fill="#a78bfa" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Tracking & 3D Twin</text>

    <rect x="20" y="55" width="160" height="65" rx="8" fill="#0f172a" stroke="#8b5cf6" />
    <text x="100" y="80" fill="#ddd6fe" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">MLflow Logging</text>
    <text x="100" y="100" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">RMSE, MAE, R², Latency</text>

    <rect x="20" y="135" width="160" height="65" rx="8" fill="#0f172a" stroke="#10b981" />
    <text x="100" y="160" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Three.js 3D Pack</text>
    <text x="100" y="180" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">4S - 12S Active Imbalance</text>

    <rect x="20" y="215" width="160" height="75" rx="8" fill="#0f172a" stroke="#38bdf8" />
    <text x="100" y="240" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Zero-Credential CLI</text>
    <text x="100" y="260" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">pistgat-bench run</text>
    <text x="100" y="275" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="monospace">--dataset nasa --sample</text>
  </g>
</svg>
